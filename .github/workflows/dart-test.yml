name: Dart Test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CONVEX_URL: ${{ secrets.CONVEX_URL }}
      CONVEX_AUTH_TOKEN: ${{ secrets.CONVEX_AUTH_TOKEN }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            packages/convex_dart/convex-test/package-lock.json
            packages/example/package-lock.json

      - run: dart pub get

      - run: dart format --set-exit-if-changed packages/convex_dart packages/convex_dart_cli packages/example

      - run: dart analyze packages/convex_dart packages/convex_dart_cli packages/example

      - run: dart test --exclude-tags integration packages/convex_dart/test packages/convex_dart_cli/test

      - name: Deploy integration test backend
        working-directory: packages/convex_dart/convex-test
        run: |
          npm ci
          node scripts/generate-integration-keys.mjs
          echo "CONVEX_AUTH_TOKEN=$(node scripts/sign-integration-jwt.mjs)" >> "$GITHUB_ENV"
          npx convex deploy

      - run: dart test packages/convex_dart/test/integration/

      - run: dart test packages/convex_dart_cli/test/integration/

      - name: Deploy example backend
        working-directory: packages/example
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.EXAMPLE_CONVEX_DEPLOY_KEY }}
        run: |
          npm ci
          npx convex deploy

      - run: dart test packages/example/test
